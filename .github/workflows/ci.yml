name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      should-publish: ${{ steps.existing-tag.outputs.should-publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Liberica JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          set -o pipefail
          version=$(./gradlew properties --no-daemon | grep '^version: ' | cut -d ' ' -f 2)
          if [[ -z "$version" ]]; then
            echo "Could not read project version from Gradle." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether stable version is already released
        id: existing-tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == 'true' ]]; then
            echo "Snapshot version; publication is allowed."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          elif git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists; publication will be skipped."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Publish JUnit test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6.6.1
        with:
          report_paths: build/test-results/test/TEST-*.xml
          detailed_summary: true
          failed_summary_logs: true
          require_tests: true

      - name: Upload test and Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            build/reports/tests/test/
            build/reports/playwright/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.should-publish == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Liberica JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image name
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build and publish image with Spring Boot
        run: >-
          ./gradlew bootBuildImage --no-daemon --publishImage
          --imageName="$IMAGE_NAME"
          -PadditionalTags

      - name: Create version tag and GitHub Release
        if: needs.test.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          tag="v$VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; refusing to move an existing release tag." >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --notes "Container image: ghcr.io/${GITHUB_REPOSITORY}:$VERSION"
