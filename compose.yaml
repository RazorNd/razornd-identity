services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.38.0'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=razornd_identity'
      - 'POSTGRES_PASSWORD=razornd_identity_local_dev'
      - 'POSTGRES_USER=razornd_identity'
    ports:
      - '57483:5432'
  redis:
    image: 'redis:8.10.2'
    ports:
      - '57484:6379'
