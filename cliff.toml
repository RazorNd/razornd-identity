[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
- {% if commit.scope == "ci" %}**CI:** {% elif commit.scope == "ui" %}**UI:** {% elif commit.scope == "oauth" %}**OAuth:** {% elif commit.scope == "oauth2" %}**OAuth 2.0:** {% elif commit.scope == "deps" %}**Dependencies:** {% elif commit.scope %}**{{ commit.scope | upper_first }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(test|chore|build|refactor)", group = "<!-- 4 -->Maintenance and tests" },
  { message = ".*", group = "<!-- 5 -->Other changes" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
