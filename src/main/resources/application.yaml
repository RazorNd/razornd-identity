spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: razornd-identity
  datasource:
    url: ${identity.db.url}
    username: ${identity.db.username}
    password: ${identity.db.password}
  data:
    redis:
      host: ${identity.redis.host}
      port: ${identity.redis.port:6379}
      password: ${identity.redis.password}
  session:
    data:
      redis:
        namespace: razornd:identity:session
    timeout: 30d
  web:
    resources:
      cache:
        cachecontrol:
          cache-public: true
          max-age: 2h
server:
  port: ${identity.server.port:8080}
  forward-headers-strategy: ${identity.server.forward-headers-strategy:framework}

logging:
  group:
    authentication: org.springframework.security.authentication
    oauth2: org.springframework.security.oauth2
    json.add:
      'service.name': ${spring.application.name}
